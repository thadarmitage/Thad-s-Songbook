<title>Thad's Songbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light;
    --paper:#F2ECDD;
    --paper-raised:#FAF6EA;
    --cover:#6B2737;
    --cover-dark:#541E2A;
    --ink:#23303D;
    --ink-soft:#5B6570;
    --brass:#B8933E;
    --brass-soft:#D8BE84;
    --sage:#7A8B76;
    --hairline:#D8CDB0;
    --danger:#A14545;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  #app{max-width:720px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}

  /* ---------- Header ---------- */
  header.top{
    background:var(--cover);
    background-image:linear-gradient(180deg, var(--cover) 0%, var(--cover-dark) 100%);
    color:var(--paper-raised);
    padding:22px 18px 16px;
    position:sticky;top:0;z-index:20;
    box-shadow:0 4px 14px rgba(0,0,0,0.18);
  }
  header.top h1{
    font-family:'Lora',serif;
    font-weight:700;
    font-size:1.5rem;
    margin:0 0 2px 0;
    letter-spacing:0.2px;
  }
  header.top .sub{
    font-size:0.78rem;
    color:var(--brass-soft);
    font-weight:500;
  }
  .search-row{
    margin-top:14px;
    display:flex;
    gap:8px;
  }
  .search-row input{
    flex:1;
    background:rgba(255,255,255,0.94);
    border:none;
    border-radius:8px;
    padding:10px 12px;
    font-size:0.95rem;
    font-family:'Inter',sans-serif;
    color:var(--ink);
    outline:none;
  }
  .search-row input::placeholder{color:#8a8478;}
  .add-btn{
    flex:0 0 auto;
    width:42px;height:42px;
    border-radius:8px;
    border:none;
    background:var(--brass);
    color:var(--cover-dark);
    font-size:1.5rem;
    font-weight:700;
    line-height:1;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    padding:0 0 2px 0;
  }
  .add-btn:active{background:var(--brass-soft);}

  /* ---------- Tabs (binder tabs) ---------- */
  .tabs{
    display:flex;
    overflow-x:auto;
    gap:6px;
    padding:12px 14px 0 14px;
    background:var(--paper);
    position:sticky;top:96px;z-index:19;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto;
    padding:8px 14px 10px;
    font-size:0.82rem;
    font-weight:600;
    font-family:'Inter',sans-serif;
    color:var(--ink-soft);
    background:var(--paper-raised);
    border:1px solid var(--hairline);
    border-bottom:none;
    border-radius:8px 8px 0 0;
    cursor:pointer;
    white-space:nowrap;
    position:relative;
    top:1px;
  }
  .tab.active{
    color:var(--cover);
    background:var(--paper);
    border-color:var(--brass);
    border-bottom:3px solid var(--paper);
    margin-bottom:-1px;
  }
  .tab .count{
    color:var(--brass);
    font-weight:500;
    margin-left:4px;
  }
  .tab.active .count{color:var(--sage);}

  .list-divider{
    border-bottom:1px solid var(--hairline);
    margin:0 14px;
  }

  /* ---------- List ---------- */
  main{flex:1;padding:10px 14px 90px;}
  .result-meta{
    font-size:0.78rem;
    color:var(--ink-soft);
    padding:10px 2px 6px;
  }
  .song-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
    padding:13px 4px;
    border-bottom:1px solid var(--hairline);
    cursor:pointer;
  }
  .song-row:active{background:var(--paper-raised);}
  .song-row .left{min-width:0;}
  .song-title{
    font-family:'Lora',serif;
    font-weight:600;
    font-size:1.02rem;
    color:var(--ink);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .song-meta{
    font-size:0.78rem;
    color:var(--ink-soft);
    margin-top:2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .song-row .right{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .cat-pill{
    font-size:0.68rem;
    font-weight:600;
    padding:3px 8px;
    border-radius:20px;
    background:var(--paper-raised);
    border:1px solid var(--hairline);
    color:var(--ink-soft);
  }
  .star{
    font-size:1rem;
    color:var(--brass);
    opacity:0;
    width:16px;
  }
  .star.on{opacity:1;}

  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
  }
  .empty-state .big{
    font-family:'Lora',serif;
    font-size:1.1rem;
    color:var(--ink);
    margin-bottom:6px;
  }

  /* ---------- Detail view ---------- */
  #detail{
    position:fixed;inset:0;
    background:var(--paper);
    z-index:50;
    display:none;
    flex-direction:column;
    max-width:720px;
    margin:0 auto;
  }
  #detail.open{display:flex;}
  .detail-head{
    background:var(--cover);
    background-image:linear-gradient(180deg, var(--cover) 0%, var(--cover-dark) 100%);
    color:var(--paper-raised);
    padding:16px 16px 14px;
    box-shadow:0 4px 14px rgba(0,0,0,0.18);
  }
  .back-btn{
    background:none;border:none;color:var(--brass-soft);
    font-size:0.88rem;font-weight:600;font-family:'Inter',sans-serif;
    padding:0 0 12px 0;cursor:pointer;
    display:flex;align-items:center;gap:4px;
  }
  .detail-title-row{
    display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
  }
  .detail-title{
    font-family:'Lora',serif;font-weight:700;font-size:1.35rem;
    line-height:1.25;
  }
  .detail-star{
    background:none;border:none;font-size:1.4rem;color:var(--brass-soft);
    cursor:pointer;flex:0 0 auto;padding:2px;
  }
  .detail-star.on{color:var(--brass);}
  .detail-meta-line{
    font-size:0.82rem;color:var(--brass-soft);margin-top:4px;
  }

  .toggle-row{
    display:flex;gap:0;
    padding:14px 16px 0;
    background:var(--paper);
    border-bottom:1px solid var(--hairline);
  }
  .toggle-btn{
    flex:1;text-align:center;
    padding:9px 0 11px;
    font-size:0.85rem;font-weight:600;
    color:var(--ink-soft);
    background:none;border:none;
    border-bottom:3px solid transparent;
    cursor:pointer;
  }
  .toggle-btn.active{
    color:var(--cover);
    border-bottom-color:var(--brass);
  }

  .detail-body{
    flex:1;overflow-y:auto;
    padding:18px 16px 40px;
  }
  .chart-box{
    background:var(--paper-raised);
    border:1px solid var(--hairline);
    border-radius:10px;
    padding:16px 14px;
    font-family:'IBM Plex Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
    font-variant-ligatures:none;
    font-size:0.86rem;
    line-height:1.55;
    white-space:pre;
    color:var(--ink);
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
  }
  .empty-chart-note{
    text-align:center;color:var(--ink-soft);padding:30px 10px;font-size:0.9rem;
  }
  textarea.edit-area{
    width:100%;min-height:300px;
    font-family:'IBM Plex Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
    font-variant-ligatures:none;
    font-size:0.86rem;line-height:1.55;
    white-space:pre;
    overflow-x:auto;
    background:var(--paper-raised);
    border:1px solid var(--brass);
    border-radius:10px;
    padding:16px 14px;
    color:var(--ink);
    resize:vertical;
  }
  .edit-actions{
    display:flex;gap:8px;margin-top:10px;
  }
  .btn{
    font-family:'Inter',sans-serif;font-size:0.85rem;font-weight:600;
    padding:9px 16px;border-radius:8px;border:1px solid var(--hairline);
    background:var(--paper-raised);color:var(--ink);cursor:pointer;
  }
  .btn.primary{background:var(--cover);color:var(--paper-raised);border-color:var(--cover);}
  .btn.ghost{background:none;}
  .edit-toggle-link{
    display:block;text-align:right;font-size:0.78rem;color:var(--sage);
    margin-top:10px;cursor:pointer;font-weight:600;
  }
  .save-flash{
    font-size:0.76rem;color:var(--sage);margin-top:8px;text-align:right;
    height:14px;
  }

  #addOverlay{
    position:fixed;inset:0;
    background:var(--paper);
    z-index:60;
    display:none;
    flex-direction:column;
    max-width:720px;
    margin:0 auto;
  }
  #addOverlay.open{display:flex;}
  .add-body{
    flex:1;overflow-y:auto;
    padding:18px 16px 40px;
  }
  .add-label{
    display:block;
    font-size:0.78rem;font-weight:600;
    color:var(--ink-soft);
    margin:16px 0 6px;
  }
  .add-label:first-child{margin-top:0;}
  .add-input{
    width:100%;
    font-family:'Inter',sans-serif;
    font-size:0.95rem;
    padding:9px 11px;
    border-radius:8px;
    border:1px solid var(--hairline);
    background:var(--paper-raised);
    color:var(--ink);
  }
  select.add-input{
    appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235B6570' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat:no-repeat;
    background-position:right 10px center;
    background-size:16px;
  }
  .add-textarea{
    min-height:140px;
    font-family:'IBM Plex Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
    font-variant-ligatures:none;
    font-size:0.86rem;line-height:1.5;
    white-space:pre;
    overflow-x:auto;
    resize:vertical;
  }

  ::selection{background:var(--brass-soft);}

  @media (max-width:400px){
    .detail-title{font-size:1.15rem;}
    header.top h1{font-size:1.3rem;}
  }
</style>
</head>
<body>
<div id="app">

  <header class="top">
    <h1>Thad's Songbook</h1>
    <div class="sub" id="countLine">624 songs</div>
    <div class="search-row">
      <input type="text" id="searchInput" placeholder="Search title or author…" autocomplete="off">
      <button class="add-btn" id="addSongBtn" title="Add a new song" aria-label="Add a new song">+</button>
    </div>
  </header>

  <div class="tabs" id="tabs"></div>
  <div class="list-divider"></div>

  <main>
    <div class="result-meta" id="resultMeta"></div>
    <div id="listContainer"></div>
  </main>

  <div id="detail">
    <div class="detail-head">
      <button class="back-btn" id="backBtn">&larr; Back to list</button>
      <div class="detail-title-row">
        <div>
          <div class="detail-title" id="dTitle"></div>
          <div class="detail-meta-line" id="dMeta"></div>
        </div>
        <button class="detail-star" id="dStar">&#9733;</button>
      </div>
    </div>
    <div class="toggle-row">
      <button class="toggle-btn active" id="tabWords">Lyrics</button>
      <button class="toggle-btn" id="tabChords">Chords</button>
    </div>
    <div class="detail-body">
      <div id="viewBox"></div>
      <div id="editBox" style="display:none;">
        <textarea class="edit-area" id="editArea" wrap="off" spellcheck="false" autocapitalize="off" autocorrect="off"></textarea>
        <div class="edit-actions">
          <button class="btn primary" id="saveBtn">Save changes</button>
          <button class="btn ghost" id="cancelBtn">Cancel</button>
        </div>
        <div class="save-flash" id="saveFlash"></div>
      </div>
      <div class="edit-toggle-link" id="editToggleLink">Edit this text</div>
    </div>
  </div>

  <div id="addOverlay">
    <div class="detail-head">
      <button class="back-btn" id="addBackBtn">&larr; Cancel</button>
      <div class="detail-title-row">
        <div class="detail-title">New Song</div>
      </div>
    </div>
    <div class="add-body">
      <label class="add-label">Title *</label>
      <input type="text" id="newTitle" class="add-input" placeholder="Song title" autocomplete="off">

      <label class="add-label">Author</label>
      <input type="text" id="newAuthor" class="add-input" placeholder="Author or writer" autocomplete="off">

      <label class="add-label">Category</label>
      <select id="newCategory" class="add-input">
        <option value="PRAISE">Praise</option>
        <option value="PERSONAL">Personal</option>
        <option value="CHILDREN">Children</option>
        <option value="CHRISTMAS">Christmas</option>
        <option value="WEDDING">Wedding</option>
      </select>

      <label class="add-label">Year</label>
      <input type="number" id="newYear" class="add-input" placeholder="e.g. 1998" autocomplete="off">

      <label class="add-label">Lyrics</label>
      <textarea id="newWords" class="add-input add-textarea" placeholder="Song lyrics…" wrap="off" spellcheck="false"></textarea>

      <label class="add-label">Chords</label>
      <textarea id="newChords" class="add-input add-textarea" placeholder="Chord chart…" wrap="off" spellcheck="false"></textarea>

      <div class="edit-actions">
        <button class="btn primary" id="saveNewSongBtn">Save song</button>
        <button class="btn ghost" id="cancelNewSongBtn">Cancel</button>
      </div>
      <div class="save-flash" id="addSaveFlash"></div>
    </div>
  </div>

   F       G            Am7\nOVER ALL MY DREAMS, IN MY DARKEST HOUR.\n     G          F    G       Dm7\nYOU ARE THE LORD OF ALL I AM.\n             F        G        C  G\nSO WON'T YOU REIGN IN ME AGAIN.\n                                              (repeat verse 1 and chorus)\n\nVerse 2:\nC    G     F2            G          C\nOVER EVERY THOUGHT, OVER EVERY WORD,\n       G            F2         G          Am7\nMAY MY LIFE REFLECT THE BEAUTY OF MY LORD:\n           G              F2         G            Dm7     \n'CAUSE YOU MEAN MORE TO ME; THAN ANY EARTHLY THING.\n             F        G        C\nSO WON'T YOU REIGN IN ME AGAIN.\n                                              (Chorus)\n\nTag ending:\nDm7       F        G        Dm7\nWON'T YOU REIGN IN ME AGAIN.\n          F        G        C  G  F2  C  G  F2  C  G  F2\nWON'T YOU REIGN IN ME AGAIN.", "year": 1998, "favorite": false}, {"id": 742, "title": "HOLY, HOLY, HOLY LORD GOD ALMIGHTY", "author": "JOHN DYKES", "category": "PRAISE", "words": "HOLY, HOLY, HOLY! LORD GOD ALMIGHTY\nEARLY IN THE MORNING \nOUR SONG SHALL RISE TO THEE\n\nHOLY, HOLY, HOLY! MERCIFUL AND MIGHTY\nGOD IN THREE PERSONS, BLESSED TRINITY\n\nHOLY, HOLY, HOLY! LORD GOD ALMIGHTY\nALL THY WORKS SHALL PRAISE THY NAME \nIN EARTH AND SKY AND SEA;", "chords": "C           G C   F          C\nHOLY, HOLY, HOLY! LORD GOD ALMIGHTY\nG     C  G   Am  G\nEARLY IN THE MORNING\nC   G          D7      G   G7 \nOUR SONG SHALL RISE TO THEE\n\nChorus\nC           G C   F            C\nHOLY, HOLY, HOLY! MERCIFUL AND MIGHTY\nAm  C7       F  C     F       G7   C\nGOD IN THREE PERSONS, BLESSED TRINITY\n\nC           G C   F          C\nHOLY, HOLY, HOLY! LORD GOD ALMIGHTY\nG       C     G     Am         G\nALL THY WORKS SHALL PRAISE THY NAME \nC  G        D7       G  G7\nIN EARTH AND SKY AND SEA;", "year": null, "favorite": false}, {"id": 744, "title": "ONWARD CHRISTIAN SOLDIERS", "author": "SIR ARTHUR SULLIVAN", "category": "PRAISE", "words": "ONWARD CHRISTIAN SOLDIERS!\nMARCHING AS TO WAR.\nWITH THE CROSS OF JESUS\nGOING ON BEFORE.\nCHRIST, THE ROYAL MASTER,\nLEADS AGAINST THE FOE;\nFORWARD INTO BATTLE,\nSEE HIS BANNERS GO!\n\nChorus:\nONWARD CHRISTIAN SOLDIERS,\nMARCHING AS TO WAR,\nWITH THE CROSS OF JESUS\nGOING ON BEFORE.\n\nLIKE A MIGHTY ARMY\nMOVES THE CHURCH OF GOD;\nBROTHERS, WE ARE TREADING\nWHERE THE SAINTS HAVE TROD;\nWE ARE NOT DIVIDED;\nALL ONE BODY WE,\nONE IN HOPE AND DOCTRINE,\nONE IN CHARITY.", "chords": "D                A7\nONWARD CHRISTIAN SOLDIERS!\n               D\nMARCHING AS TO WAR.\n                  Asus A\nWITH THE CROSS OF JESUS\nE7         A\nGOING ON BEFORE.\n                  D\nCHRIST, THE ROYAL MASTER,\n                  G\nLEADS AGAINST THE FOE;\nG\nFORWARD INTO BATTLE,\n                A\nSEE HIS BANNERS GO!\n\nChorus:\nD                A\nONWARD CHRISTIAN SOLDIERS,\nA7             D\nMARCHING AS TO WAR,\n         A        D\nWITH THE CROSS OF JESUS\nG     A7   D\nGOING ON BEFORE.\n\nD             A7\nLIKE A MIGHTY ARMY\n                    D\nMOVES THE CHURCH OF GOD;\n                 Asus A\nBROTHERS, WE ARE TREADING\nE7                    A\nWHERE THE SAINTS HAVE TROD;\n             D\nWE ARE NOT DIVIDED;\n             G\nALL ONE BODY WE,\nG\nONE IN HOPE AND DOCTRINE,\n            A\nONE IN CHARITY.", "year": null, "favorite": false}, {"id": 754, "title": "AGNUS DEI", "author": "MICHAEL W.SMITH", "category": "PRAISE", "words": "Chorus:\nALLELUIA  ALLELUIA  \nFOR OUR LORD GOD ALMIGHTY REIGNS\nALLELUIA  ALLELUIA\nFOR OUR LORD GOD ALMIGHTY REIGNS\nALLELUIA \n\nHOLY,  HOLY  ARE YOU LORD GOD ALMIGHTY\nWORTHY IS THE LAMB, WORTHY IS THE LAMB\nFOR YOU ARE HOLY, HOLY, ARE YOU LORD GOD ALMIGHTY\nWORTHY IS THE LAMB, WORTHY IS THE LAMB....AMEN\n                                           (Chorus)\n\nHOLY,  HOLY  ARE YOU LORD GOD ALMIGHTY\nWORTHY IS THE LAMB, WORTHY IS THE LAMB, \nWORTHY IS THE LAMB, WORTHY IS THE LAMB\nFOR YOU ARE HOLY, HOLY, ARE YOU LORD GOD ALMIGHTY\nWORTHY IS THE LAMB, WORTHY IS THE LAMB, \nWORTHY IS THE LAMB, WORTHY IS THE LAMB\n                                                                      (Chorus)", "chords": "|A    |A    |A    |A    |\nCHORUS\nA   D  A  A     D   \nALLELUIA  ALLELUIA  \nD       Amaj7        D          A\nFOR OUR LORD GOD ALMIGHTY REIGNS\nA   D  A  A      D\nALLELUIA  ALLELUIA\nD       Amaj7        D          A\nFOR OUR LORD GOD ALMIGHTY REIGNS\nA       D\nALLELUIA \n\nD E A  E  A          D    A     F#m  E\nHOLY,  HOLY  ARE YOU LORD GOD ALMIGHTY\n              D\nWORTHY IS THE LAMB, WORTHY IS THE LAMB\n         A  E  A          D    A     F#m  E\nFOR YOU ARE HOLY, HOLY, ARE YOU LORD GOD ALMIGHTY\n              D                            E   A\nWORTHY IS THE LAMB, WORTHY IS THE LAMB....AMEN\n                                           (CHORUS)\n\nD E A  E  A          D    A     F#m  E\nHOLY,  HOLY  ARE YOU LORD GOD ALMIGHTY\n              D\nWORTHY IS THE LAMB, WORTHY IS THE LAMB, \nD\nWORTHY IS THE LAMB, WORTHY IS THE LAMB\n         A  E  A          D    A     F#m  E\nFOR YOU ARE HOLY, HOLY, ARE YOU LORD GOD ALMIGHTY\n              D             \nWORTHY IS THE LAMB, WORTHY IS THE LAMB, \nD             \nWORTHY IS THE LAMB, WORTHY IS THE LAMB", "year": null, "favorite": false}, {"id": 756, "title": "WHISPERING HOPE", "author": "ALICE HAWTHORNE", "category": "PRAISE", "words": "SOFT AS THE VOICE OF AN ANGEL,\nBREATHING A LESSON UNHEARD,\nHOPE WITH A GENTLE PERSUASION\nWHISPERS HER COMFORTING WORD:\n\"WAIT TILL THE DARKNESS IS OVER,\nWAIT TILL THE TEMPEST IS DONE;\nHOPE FOR THE SUNSHINE TOMORROW,\nAFTER THE SHOWER IS GONE.\"\n\nChorus\nWHISPERING HOPE,\nOH, HOW WELCOME THY VOICE,\nMAKING MY HEART IN ITS SORROW REJOICE\n\nIF IN THE DUSK OF THE TWILIGHT,\nDIM BE THE REGION AFAR,\nWILL NOT THE DEEPENING DARKNESS\nBRIGHTEN THE GLIMMERING STAR?\nTHEN, WHEN THE NIGHT IS UPON US,\nWHY SHOULD THE HEART SINK AWAY?\nWHEN THE DARK MIDNIGHT IS OVER,\nWATCH FOR THE BREAKING OF DAY", "chords": "C           F           C\nSOFT AS THE VOICE OF AN ANGEL,\nG7                   C\nBREATHING A LESSON UNHEARD,\n                      F\nHOPE WITH A GENTLE PERSUASION\nC            G7         C\nWHISPERS HER COMFORTING WORD:\n               G7          C Am\n\"WAIT TILL THE DARKNESS IS OVER,\nG             D7         G    G7\nWAIT TILL THE TEMPEST IS DONE;\nC            F          C\nHOPE FOR THE SUNSHINE TOMORROW,\n          G7        C\nAFTER THE SHOWER IS GONE.\"\n\n\nChorus\nG7         C\nWHISPERING HOPE,\n        G           C\nOH, HOW WELCOME THY VOICE,\nF         C            G     G7 C \nMAKING MY HEART IN ITS SORROW REJOICE\n\nC         F           C\nIF IN THE DUSK OF THE TWILIGHT,\nG7                 C\nDIM BE THE REGION AFAR,\n                       F\nWILL NOT THE DEEPENING DARKNESS\nC            G7         C\nBRIGHTEN THE GLIMMERING STAR?\n               G7         C  Am\nTHEN, WHEN THE NIGHT IS UPON US,\nG              D7          G   G7\nWHY SHOULD THE HEART SINK AWAY?\nC             F           C\nWHEN THE DARK MIDNIGHT IS OVER,\n              G7          C\nWATCH FOR THE BREAKING OF DAY", "year": null, "favorite": false}, {"id": 757, "title": "LONELY VOICES", "author": "BILLIE HANKS JR", "category": "PERSONAL", "words": "LONELY VOICES CRYING IN THE CITY,\nLONELY VOICES SOUNDING LIKE A CHILD.\nLONELY VOICES COME FROM BUSY PEOPLE;\nTOO DISTURBED TO STOP A LITTLE WHILE.\nLONELY VOICES FILL MY DREAMS;\nLONELY VOICES HAUNT MY MEMORY.\n\nLONELY FACES LOOKING FOR THE SUNRISE\nJUST TO FIND ANOTHER BUSY DAY.\nLONELY FACES ALL AROUND THE CITY;\nMEN AFRAID, BUT TOO ASHAMED TO PRAY.\nLONELY FACES DO I SEE;\nLONELY FACES HAUNT MY MEMORY.\n\nLONELY EYES I SEE THEM IN THE SUBWAY;\nBURDENED BY THE WORRIES OF THE DAY:\nMEN AT LEISURE, BUT THEY'RE SO UNHAPPY,\nTIRED OF FOOLISH ROLES THEY TRY TO PLAY.\nLONELY PEOPLE DO I SEE;\nLONELY PEOPLE HAUNT MY MEMORY.\n\nABUNDANT LIFE HE CAME TO TRULY GIVE MAN;\nBUT SO FEW HIS GIFT OF GRACE RECEIVE.\nLONELY PEOPLE LIVE IN EVERY CITY;\nMEN WHO FACE A DARK AND LONELY GRAVE.\nLONELY FACES DO I SEE;\nLONELY VOICES CALLING OUT TO ME.", "chords": "G                           Am\nLONELY VOICES CRYING IN THE CITY,\nD7                            G\nLONELY VOICES SOUNDING LIKE A CHILD.\nG                            Am\nLONELY VOICES COME FROM BUSY PEOPLE;\nD7                             G\nTOO DISTURBED TO STOP A LITTLE WHILE.\n       Am             G\nLONELY VOICES FILL MY DREAMS;\n       Am              G\nLONELY VOICES HAUNT MY MEMORY.\n\nLONELY FACES LOOKING FOR THE SUNRISE\nJUST TO FIND ANOTHER BUSY DAY.\nLONELY FACES ALL AROUND THE CITY;\nMEN AFRAID, BUT TOO ASHAMED TO PRAY.\nLONELY FACES DO I SEE;\nLONELY FACES HAUNT MY MEMORY.\n\nLONELY EYES I SEE THEM IN THE SUBWAY;\nBURDENED BY THE WORRIES OF THE DAY:\nMEN AT LEISURE, BUT THEY'RE SO UNHAPPY,\nTIRED OF FOOLISH ROLES THEY TRY TO PLAY.\nLONELY PEOPLE DO I SEE;\nLONELY PEOPLE HAUNT MY MEMORY.\n\nABUNDANT LIFE HE CAME TO TRULY GIVE MAN;\nBUT SO FEW HIS GIFT OF GRACE RECEIVE.\nLONELY PEOPLE LIVE IN EVERY CITY;\nMEN WHO FACE A DARK AND LONELY GRAVE.\nLONELY FACES DO I SEE;\nLONELY VOICES CALLING OUT TO ME.", "year": 1967, "favorite": false}, {"id": 758, "title": "MY FAITH LOOKS UP TO THEE", "author": "LOWELL MASON", "category": "PERSONAL", "words": "MY FAITH LOOKS UP TO THEE,\nTHOU LAMB OF CALVARY,\nSAVIOR DIVINE!\nNOW HEAR ME WHILE I PRAY,\nTAKE ALL MY GUILT AWAY\nOH, LET ME FROM THIS DAY\nBE WHOLLY THINE.\n\nMAY THY RICH GRACE IMPART\nSTRENGTH TO MY FAINTING HEART,\nMY ZEAL INSPIRE;\nAS THOU HAST DIED FOR ME,\nO MAY MY LOVE TO THEE\nPURE, WARM AND CHANGELESS BE,\nA LIVING FIRE!", "chords": "D              A7    D\nMY FAITH LOOKS UP TO THEE,\nA7\nTHOU LAMB OF CALVARY,\nD  E7  A\nSAVIOR DIVINE!\nD\nNOW HEAR ME WHILE I PRAY,\n\nTAKE ALL MY GUILT AWAY\nG          A7        D\nOH, LET ME FROM THIS DAY\n   G   A7 D\nBE WHOLLY THINE.\n\nMAY THY RICH GRACE IMPART\nSTRENGTH TO MY FAINTING HEART,\nMY ZEAL INSPIRE;\nAS THOU HAST DIED FOR ME,\nO MAY MY LOVE TO THEE\nPURE, WARM AND CHANGELESS BE,\nA LIVING FIRE!", "year": null, "favorite": false}, {"id": 759, "title": "THE CHURCH WITHIN US", "author": "KEN SCHNEDER", "category": "PERSONAL", "words": "THERE\u2019S A CHURCH WITHIN US, O LORD;\nTHERE\u2019S A CHURCH WITHIN US, O LORD;\nNOT A BUILDING BUT A SOUL;\nNOT A PORTION BUT A WHOLE,\nTHERE\u2019S A CHURCH WITHIN US, O LORD\n\nTHERE\u2019S POTENTIAL WITHIN US, O LORD;\nSOMETHING STIRRING WITHIN US O LORD;\nSOMETHING STRAINING TO HAVE BIRTH, \nTO BE VISIBLE ON EARTH,\nTHERE\u2019S POTENTIAL WITHIN US, O LORD.\n\nTHERE\u2019S A FIRE WITHIN US, O LORD;\nA NEW LIFE A BURNING, O LORD;\nA NEW FIRE FOR NEW LIFE, \nCOMBATTING PRESENT STRIFE\nTHERE\u2019S A FIRE WITHIN US, O LORD\n\nTHERE\u2019S SOME BUILDING TO BE DONE, O LORD;\nTHERE\u2019S SOME BUILDING TO BE DONE, O LORD;\nNOT WITH STEEL, NOT WITH STONE,\nBUT WITH THE LIVES WHICH ARE YOUR OWN,\nTHERE\u2019S THE CHURCH TO BE BUILT, O LORD.\n\nTHERE\u2019S A CHURCH WITHIN US, O LORD;\nTHERE\u2019S A CHURCH WITHIN US, O LORD;\nNOT A BUILDING BUT ONE SOUL\nNOT A PORTION, BUT ONE WHOLE\nWE ARE YOUR CHURCH IN THE WORLD.", "chords": "Dm                   G        Dm\nTHERE\u2019S A CHURCH WITHIN US, O LORD;\n                     F      Bb A\nTHERE\u2019S A CHURCH WITHIN US, O  LORD;\n      Dm             C\nNOT A BUILDING BUT A SOUL;\n      Gm      Bb    A\nNOT A PORTION BUT A WHOLE,\nDm                   G        Dm\nTHERE\u2019S A CHURCH WITHIN US, O LORD\n\nTHERE\u2019S POTENTIAL WITHIN US, O LORD;\nSOMETHING STIRRING WITHIN US O LORD;\nSOMETHING STRAINING TO HAVE BIRTH, \nTO BE VISIBLE ON EARTH,\nTHERE\u2019S POTENTIAL WITHIN US, O LORD.\n\nTHERE\u2019S A FIRE WITHIN US, O LORD;\nA NEW LIFE ABURNING, O LORD;\nA NEW FIRE FOR NEW LIFE, \nCOMBATTING PRESENT STRIFE\nTHERE\u2019S A FIRE WITHIN US, O LORD\n\nTHERE\u2019S SOME BUILDING TO BE DONE, O LORD;\nTHERE\u2019S SOME BUILDING TO BE DONE, O LORD;\nNOT WITH STEEL, NOT WITH STONE,\nBUT WITH THE LIVES WHICH ARE YOUR OWN,\nTHERE\u2019S THE CHURCH TO BE BUILT, O LORD.\n\nTHERE\u2019S A CHURCH WITHIN US, O LORD;\nTHERE\u2019S A CHURCH WITHIN US, O LORD;\nNOT A BUILDING BUT ONE SOUL\nNOT A PORTION, BUT ONE WHOLE\nWE ARE YOUR CHURCH IN THE WORLD.", "year": 1967, "favorite": false}, {"id": 760, "title": "YES,GOD IS REAL", "author": "PHILLIP LANDGRAVE", "category": "PERSONAL", "words": "YES, GOD IS REAL, DON'T YOU FEEL HIS PRESENCE\nYES, GOD IS REAL, DON'T YOU KNOW HIS POW'R IS NEAR?\nGOD IS HERE, WON'T YOU BELIEVE IT?\nHERE IN LOVE, WON'T YOU RECEIVE IT?\nSIMPLY TRUST HIM AND YOU WILL KNOW THAT GOD IS REAL\n\nYES, GOD WILL CARE, SHARE WITH HIM WHAT'S ON YOUR HEART\nYES, GOD WILL CARE, DARE TO TELL HIM EV'RY PART.\nGOD WILL HEAL YOUR DEEPEST SORROW,\nHE WILL HELP YOU FACE TOMORROW\nSIMPLY TRUST HIM AND YOU WILL KNOW THAT GOD WILL CARE\n\nYES, GOD WILL LEAD, FIRM BUT GENTLE HIS COMMAND\nYES, GOD WILL LEAD, LET HIM LEAD YOU BY THE HAND.\nGOD WILL GUIDE, THO' ROUGH THE WAY MAY SEEM;\nHE WILL GUIDE BEYOND YOUR HIGHEST DREAM.\nSIMPLY TRUST HIM AND YOU WILL KNOW THAT GOD WILL LEAD\nFOR HE WILL CARE, FOR GOD IS REAL", "chords": "F           C7              F        C7\nYES, GOD IS REAL, DON'T YOU FEEL HIS PRESENCE\nD7          Gm    D7        Gm       D7       Gm\nYES, GOD IS REAL, DON'T YOU KNOW HIS POW'R IS NEAR?\nF                        Dm \nGOD IS HERE, WON'T YOU BELIEVE IT?\n        Gm7               C7\nHERE IN LOVE, WON'T YOU RECEIVE IT?\n       F                      C7               F   C7\nSIMPLY TRUST HIM AND YOU WILL KNOW THAT GOD IS REAL\n\nYES, GOD WILL CARE, SHARE WITH HIM WHAT'S ON YOUR HEART\nYES, GOD WILL CARE, DARE TO TELL HIM EV'RY PART.\nGOD WILL HEAL YOUR DEEPEST SORROW,\nHE WILL HELP YOU FACE TOMORROW\nSIMPLY TRUST HIM AND YOU WILL KNOW THAT GOD WILL CARE\n\nYES, GOD WILL LEAD, FIRM BUT GENTLE HIS COMMAND\nYES, GOD WILL LEAD, LET HIM LEAD YOU BY THE HAND.\nGOD WILL GUIDE, THO' ROUGH THE WAY MAY SEEM;\nHE WILL GUIDE BEYOND YOUR HIGHEST DREAM.\nSIMPLY TRUST HIM AND YOU WILL KNOW THAT GOD WILL LEAD\nC7          F let customSongs = [];
let ALL_SONGS = BASE_SONGS.slice();

const state = {
  query: '',
  category: 'ALL',
  currentId: null,
  currentField: 'words', // 'words' or 'chords'
  editing: false,
  overrides: {},   // per-song {words, chords, favorite}
  addingSong: false,
};

const listContainer = document.getElementById('listContainer');
const tabsEl = document.getElementById('tabs');
const resultMeta = document.getElementById('resultMeta');
const countLine = document.getElementById('countLine');
const searchInput = document.getElementById('searchInput');
const detailEl = document.getElementById('detail');

function categories(){
  const set = {};
  ALL_SONGS.forEach(s => { set[s.category] = (set[s.category]||0) + 1; });
  return set;
}

function effectiveSong(s){
  const o = state.overrides[s.id] || {};
  return {
    ...s,
    words: o.words !== undefined ? o.words : s.words,
    chords: o.chords !== undefined ? o.chords : s.chords,
    favorite: o.favorite !== undefined ? o.favorite : s.favorite,
  };
}

function renderTabs(){
  const cats = categories();
  const order = ['ALL','PRAISE','PERSONAL','CHILDREN','CHRISTMAS','WEDDING'];
  const keys = order.filter(k => k==='ALL' || cats[k]);
  Object.keys(cats).forEach(k => { if(!order.includes(k)) keys.push(k); });

  tabsEl.innerHTML = '';
  keys.forEach(k => {
    const btn = document.createElement('div');
    btn.className = 'tab' + (state.category===k ? ' active' : '');
    const label = k==='ALL' ? 'All' : (k.charAt(0)+k.slice(1).toLowerCase());
    const count = k==='ALL' ? ALL_SONGS.length : (cats[k]||0);
    btn.innerHTML = `${label}<span class="count">${count}</span>`;
    btn.onclick = () => { state.category = k; renderTabs(); renderList(); };
    tabsEl.appendChild(btn);
  });
}

function matchesQuery(s, q){
  if(!q) return true;
  const hay = (s.title + ' ' + (s.author||'')).toLowerCase();
  return hay.includes(q);
}

function renderList(){
  const q = state.query.trim().toLowerCase();
  let filtered = ALL_SONGS.filter(s => (state.category==='ALL' || s.category===state.category) && matchesQuery(s, q));
  filtered = filtered.slice().sort((a,b) => a.title.localeCompare(b.title));

  resultMeta.textContent = q || state.category!=='ALL'
    ? `${filtered.length} song${filtered.length===1?'':'s'}`
    : '';

  listContainer.innerHTML = '';
  if(filtered.length === 0){
    listContainer.innerHTML = `<div class="empty-state"><div class="big">No songs found</div>Try a different search or category.</div>`;
    return;
  }

  const frag = document.createDocumentFragment();
  filtered.forEach(s => {
    const eff = effectiveSong(s);
    const row = document.createElement('div');
    row.className = 'song-row';
    const metaBits = [];
    if(eff.author) metaBits.push(eff.author);
    if(eff.year) metaBits.push(eff.year);
    row.innerHTML = `
      <div class="left">
        <div class="song-title">${escapeHtml(eff.title)}</div>
        <div class="song-meta">${escapeHtml(metaBits.join(' · ') || '\u00A0')}</div>
      </div>
      <div class="right">
        <span class="star ${eff.favorite ? 'on':''}">&#9733;</span>
        <span class="cat-pill">${eff.category ? eff.category.charAt(0)+eff.category.slice(1).toLowerCase() : ''}</span>
      </div>
    `;
    row.onclick = () => openDetail(s.id);
    frag.appendChild(row);
  });
  listContainer.appendChild(frag);
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---------------- Detail view ----------------
function openDetail(id){
  state.currentId = id;
  state.currentField = 'words';
  state.editing = false;
  renderDetail();
  detailEl.classList.add('open');
  window.scrollTo(0,0);
}

function closeDetail(){
  detailEl.classList.remove('open');
  state.editing = false;
  renderList();
}

function renderDetail(){
  const base = ALL_SONGS.find(s => s.id === state.currentId);
  if(!base) return;
  const eff = effectiveSong(base);

  document.getElementById('dTitle').textContent = eff.title;
  const metaBits = [];
  if(eff.author) metaBits.push(eff.author);
  if(eff.category) metaBits.push(eff.category.charAt(0)+eff.category.slice(1).toLowerCase());
  if(eff.year) metaBits.push(eff.year);
  document.getElementById('dMeta').textContent = metaBits.join(' · ');

  const star = document.getElementById('dStar');
  star.className = 'detail-star' + (eff.favorite ? ' on' : '');
  star.onclick = () => toggleFavorite(base.id);

  document.getElementById('tabWords').classList.toggle('active', state.currentField==='words');
  document.getElementById('tabChords').classList.toggle('active', state.currentField==='chords');

  renderFieldView();
}

function renderFieldView(){
  const base = ALL_SONGS.find(s => s.id === state.currentId);
  const eff = effectiveSong(base);
  const text = state.currentField === 'words' ? eff.words : eff.chords;

  const viewBox = document.getElementById('viewBox');
  const editBox = document.getElementById('editBox');
  const editToggleLink = document.getElementById('editToggleLink');
  const saveFlash = document.getElementById('saveFlash');
  saveFlash.textContent = '';

  if(state.editing){
    viewBox.style.display = 'none';
    editBox.style.display = 'block';
    editToggleLink.style.display = 'none';
    document.getElementById('editArea').value = text || '';
  } else {
    editBox.style.display = 'none';
    viewBox.style.display = 'block';
    editToggleLink.style.display = 'block';
    editToggleLink.textContent = text ? 'Edit this text' : 'Add this text';
    if(text && text.trim()){
      viewBox.innerHTML = `<div class="chart-box">${escapeHtml(text)}</div>`;
    } else {
      const label = state.currentField === 'words' ? 'lyrics' : 'chords';
      viewBox.innerHTML = `<div class="empty-chart-note">No ${label} entered for this song yet.</div>`;
    }
  }
}

document.getElementById('backBtn').onclick = closeDetail;
document.getElementById('tabWords').onclick = () => { state.currentField='words'; state.editing=false; renderDetail(); };
document.getElementById('tabChords').onclick = () => { state.currentField='chords'; state.editing=false; renderDetail(); };
document.getElementById('editToggleLink').onclick = () => { state.editing = true; renderFieldView(); };
document.getElementById('cancelBtn').onclick = () => { state.editing = false; renderFieldView(); };

document.getElementById('saveBtn').onclick = async () => {
  const base = ALL_SONGS.find(s => s.id === state.currentId);
  const newVal = document.getElementById('editArea').value;
  if(!state.overrides[base.id]) state.overrides[base.id] = {};
  state.overrides[base.id][state.currentField] = newVal;
  state.editing = false;
  await persistOverride(base.id);
  renderDetail();
  const flash = document.getElementById('saveFlash');
  flash.textContent = 'Saved';
  setTimeout(()=>{ if(flash) flash.textContent=''; }, 1800);
};

async function toggleFavorite(id){
  const base = ALL_SONGS.find(s => s.id === id);
  const eff = effectiveSong(base);
  if(!state.overrides[id]) state.overrides[id] = {};
  state.overrides[id].favorite = !eff.favorite;
  await persistOverride(id);
  renderDetail();
}

// ---------------- Persistence ----------------
async function persistOverride(id){
  try{
    localStorage.setItem('songbook.override.' + id, JSON.stringify(state.overrides[id]));
  }catch(e){
    /* Save failed silently — edit still applies for this session */
  }
}

async function loadOverrides(){
  try{
    const prefix = 'songbook.override.';
    for(let i = 0; i < localStorage.length; i++){
      const key = localStorage.key(i);
      if(key && key.indexOf(prefix) === 0){
        try{
          const raw = localStorage.getItem(key);
          if(raw){
            const id = key.slice(prefix.length);
            state.overrides[id] = JSON.parse(raw);
          }
        }catch(e){ /* skip unreadable entry */ }
      }
    }
  }catch(e){
    /* No saved edits yet, or storage unavailable — start fresh */
  }
}

searchInput.addEventListener('input', (e) => {
  state.query = e.target.value;
  renderList();
});

  addOverlay.classList.remove('open');
}

function nextSongId(){
  let max = 0;
  ALL_SONGS.forEach(s => { if (s.id > max) max = s.id; });
  return max + 1;
}

async function persistCustomSongs(){
  try{
    localStorage.setItem('songbook.customSongs', JSON.stringify(customSongs));
  }catch(e){ /* save failed silently */ }
}

async function loadCustomSongs(){
  try{
    const raw = localStorage.getItem('songbook.customSongs');
    if(raw){
      customSongs = JSON.parse(raw);
    }
  }catch(e){
    /* none saved yet */
  }
  ALL_SONGS = BASE_SONGS.concat(customSongs);
}

document.getElementById('addSongBtn').onclick = openAddForm;
document.getElementById('addBackBtn').onclick = closeAddForm;
document.getElementById('cancelNewSongBtn').onclick = closeAddForm;

document.getElementById('saveNewSongBtn').onclick = async () => {
  const title = document.getElementById('newTitle').value.trim();
  const flash = document.getElementById('addSaveFlash');
  if(!title){
    flash.textContent = 'Title is required';
    return;
  }
  const yearRaw = document.getElementById('newYear').value.trim();
  const newSong = {
    id: nextSongId(),
    title: title,
    author: document.getElementById('newAuthor').value.trim() || null,
    category: document.getElementById('newCategory').value,
    words: document.getElementById('newWords').value || null,
    chords: document.getElementById('newChords').value || null,
    year: yearRaw ? parseInt(yearRaw, 10) : null,
    favorite: false,
  };
  customSongs.push(newSong);
  ALL_SONGS = BASE_SONGS.concat(customSongs);
  await persistCustomSongs();
  closeAddForm();
  renderTabs();
  renderList();
};

// ---------------- Init ----------------
async function init(){
  await loadCustomSongs();
  countLine.textContent = ALL_SONGS.length + ' songs';
  await loadOverrides();
  renderTabs();
  renderList();
}
init();
</script>
</body>
</html>
